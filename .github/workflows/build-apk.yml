name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Configureaza Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configureaza Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compileaza APK
        run: gradle assembleDebug

      - name: Salveaza APK-ul
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorOreMunca-debug
          path: app/build/outputs/apk/debug/app-debug.apk
